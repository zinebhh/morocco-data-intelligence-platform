services:
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master-hudi
    ports:
      - "8081:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    volumes:
      - ./data_engineering:/opt/spark/data_engineering
      - ./lakehouse:/opt/spark/lakehouse
      - ./spark:/opt/spark/jobs
      - ./airflow/dags:/opt/spark/dags
    networks:
      - morocco-data-intelligence-platform_edudata-network

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-hudi
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data_engineering:/opt/spark/data_engineering
      - ./lakehouse:/opt/spark/lakehouse
      - ./spark:/opt/spark/jobs
    networks:
      - morocco-data-intelligence-platform_edudata-network
    depends_on:
      - spark-master

networks:
  morocco-data-intelligence-platform_edudata-network:
    external: true