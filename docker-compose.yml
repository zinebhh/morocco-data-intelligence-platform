services:
  # ============================================
  # POSTGRESQL
  # ============================================
  postgres:
    image: postgres:15
    container_name: edudata-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_MULTIPLE_DATABASES: airflow,analytics,metabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d  
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - edudata-network

  # ============================================
  # MINIO - Data Lake
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: edudata-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - edudata-network

  # ============================================
  # MINIO SETUP
  # ============================================
  minio-setup:
    image: minio/mc:latest
    container_name: edudata-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/raw-data --ignore-existing;
      mc mb myminio/processed-data --ignore-existing;
      mc mb myminio/lakehouse --ignore-existing;
      echo 'Buckets created successfully';
      sleep 5;
      "
    networks:
      - edudata-network

    # ============================================
  # AIRFLOW WEBSERVER
  # ============================================
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: edudata-airflow:latest
    container_name: edudata-airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=Xq7Y8Z9aB1cD2eF3gH4iJ5kL6mN7oP8qR9sT0uV1wX=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./data_engineering:/opt/airflow/data_engineering
      - ./lakehouse:/opt/airflow/lakehouse
      - ./data-science:/opt/airflow/data-science  
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin 2>/dev/null;
      airflow webserver
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network

  # ============================================
  # AIRFLOW SCHEDULER
  # ============================================
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: edudata-airflow:latest
    container_name: edudata-airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=Xq7Y8Z9aB1cD2eF3gH4iJ5kL6mN7oP8qR9sT0uV1wX=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./data_engineering:/opt/airflow/data_engineering
      - ./lakehouse:/opt/airflow/lakehouse
      - ./data-science:/opt/airflow/data-science  
    command: airflow scheduler
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network
  # ============================================
  # SPARK MASTER (avec apache/spark au lieu de bitnami)
  # ============================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: edudata-spark-master
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master*.out
      "
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data_engineering:/opt/spark/data_engineering
      - ./lakehouse:/opt/spark/lakehouse
    ports:
      - "8081:8080"
      - "7077:7077"
    depends_on:
      minio:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network

  # ============================================
  # SPARK WORKER
  # ============================================
  spark-worker:
    image: apache/spark:3.5.0
    container_name: edudata-spark-worker
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out
      "
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data_engineering:/opt/spark/data_engineering
      - ./lakehouse:/opt/spark/lakehouse
    depends_on:
      - spark-master
    restart: always
    networks:
      - edudata-network

    # ============================================
  # ELASTICSEARCH 7.17
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.15
    container_name: edudata-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always
    networks:
      - edudata-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.15
    container_name: edudata-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: always
    networks:
      - edudata-network
  # ============================================
  # METABASE - Dashboards BI
  # ============================================
  metabase:
    image: metabase/metabase:latest
    container_name: edudata-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_HOST: postgres
      MB_DB_CONNECTION_URI: "jdbc:postgresql://postgres:5432/metabase?user=airflow&password=airflow&sslmode=disable"
      JAVA_TIMEZONE: Africa/Casablanca
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network
volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
  metabase_data:

networks:
  edudata-network:
    driver: bridge