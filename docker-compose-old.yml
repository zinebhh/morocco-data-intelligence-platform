version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ''
    # MinIO
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    # PostgreSQL
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: airflow
    POSTGRES_PASSWORD: airflow
    POSTGRES_DB: airflow
    # Elasticsearch
    ELASTICSEARCH_HOST: elasticsearch
    ELASTICSEARCH_PORT: 9200
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./data_engineering:/opt/airflow/data_engineering
    - ./scripts:/opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
  networks:
    - edudata-network

services:
  # ============================================
  # POSTGRESQL - Base de données Airflow
  # ============================================
  postgres:
    image: postgres:15
    container_name: edudata-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - edudata-network

  # ============================================
  # REDIS - Broker pour Airflow (optionnel)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: edudata-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: always
    networks:
      - edudata-network

  # ============================================
  # MINIO - Data Lake
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: edudata-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - edudata-network

  # ============================================
  # MINIO SETUP - Création des buckets
  # ============================================
  minio-setup:
    image: minio/mc:latest
    container_name: edudata-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/raw-data --ignore-existing;
      mc mb myminio/processed-data --ignore-existing;
      mc mb myminio/lakehouse --ignore-existing;
      mc mb myminio/documents --ignore-existing;
      mc anonymous set download myminio/raw-data;
      echo 'Buckets created successfully';
      "
    networks:
      - edudata-network

  # ============================================
  # ELASTICSEARCH - Moteur de recherche
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: edudata-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    networks:
      - edudata-network

  # ============================================
  # KIBANA - Interface Elasticsearch (optionnel)
  # ============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: edudata-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network

  # ============================================
  # AIRFLOW WEBSERVER
  # ============================================
  airflow-webserver:
    <<: *airflow-common
    container_name: edudata-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ============================================
  # AIRFLOW SCHEDULER
  # ============================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: edudata-airflow-scheduler
    command: scheduler
    restart: always

  # ============================================
  # AIRFLOW INIT - Initialisation
  # ============================================
  airflow-init:
    <<: *airflow-common
    container_name: edudata-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow initialized successfully"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  # ============================================
  # SPARK MASTER
  # ============================================
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: edudata-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data_engineering:/opt/spark/data_engineering
    ports:
      - "8081:8080"
      - "7077:7077"
    restart: always
    networks:
      - edudata-network

  # ============================================
  # SPARK WORKER
  # ============================================
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: edudata-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data_engineering:/opt/spark/data_engineering
    depends_on:
      - spark-master
    restart: always
    networks:
      - edudata-network

  # ============================================
  # HIVE METASTORE
  # ============================================
  hive-metastore:
    build:
      context: ./hive
      dockerfile: Dockerfile
    container_name: edudata-hive-metastore
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - SERVICE_OPTS=-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=airflow -Djavax.jdo.option.ConnectionPassword=airflow
    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./hive/lib:/opt/hive/lib
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network

  # ============================================
  # METABASE - Dashboards BI
  # ============================================
  metabase:
    build:
      context: ./metabase
      dockerfile: Dockerfile
    container_name: edudata-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - edudata-network

  # ============================================
  # PROMETHEUS - Monitoring
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: edudata-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always
    networks:
      - edudata-network

  # ============================================
  # GRAFANA - Visualisation
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: edudata-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: always
    networks:
      - edudata-network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

# ============================================
# NETWORKS
# ============================================
networks:
  edudata-network:
    driver: bridge