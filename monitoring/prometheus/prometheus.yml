global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-webserver:8080']
  
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
  
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']