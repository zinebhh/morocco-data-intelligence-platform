services:

  minio:
    image: quay.io/minio/minio
    container_name: edudata-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    volumes:
      - ./data:/data

    restart: unless-stopped