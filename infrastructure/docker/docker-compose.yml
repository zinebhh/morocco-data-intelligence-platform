services:
  # ============ POSTGRESQL ============
  postgres:
    image: postgres:15
    container_name: edudata-postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    networks:
      - edudata-network

  # ============ REDIS ============
  redis:
    image: redis:7-alpine
    container_name: edudata-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - edudata-network

  # ============ MINIO ============
  minio:
    image: minio/minio:latest
    container_name: edudata-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - edudata-network

  # ============ AIRFLOW WEBSERVER ============
  airflow-webserver:
    image: apache/airflow:2.10.0-python3.10
    container_name: edudata-airflow-webserver
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=UTC
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-change-in-production
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - ../../airflow/logs:/opt/airflow/logs
      - ../../data_engineering:/opt/airflow/data_engineering
      - ../../lakehouse:/opt/airflow/lakehouse
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      pip install pandas requests minio psycopg2-binary &&
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin &&
      airflow webserver
      "
    networks:
      - edudata-network

  # ============ AIRFLOW SCHEDULER ============
  airflow-scheduler:
    image: apache/airflow:2.10.0-python3.10
    container_name: edudata-airflow-scheduler
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - ../../airflow/logs:/opt/airflow/logs
      - ../../data_engineering:/opt/airflow/data_engineering
      - ../../lakehouse:/opt/airflow/lakehouse
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      pip install pandas requests minio psycopg2-binary &&
      airflow scheduler
      "
    networks:
      - edudata-network

networks:
  edudata-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: